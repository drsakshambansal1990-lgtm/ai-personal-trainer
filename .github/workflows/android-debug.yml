name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: coach_android_m3/coach_android_m3
        env:
          ORG_GRADLE_PROJECT_PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
          ORG_GRADLE_PROJECT_REALTIME_TOKEN_URL: ${{ secrets.REALTIME_TOKEN_URL }}
          ORG_GRADLE_PROJECT_OPENAI_REALTIME_MODEL: gpt-realtime-2.1
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: coach-m3-debug-apk
          path: coach_android_m3/coach_android_m3/app/build/outputs/apk/debug/app-debug.apk
